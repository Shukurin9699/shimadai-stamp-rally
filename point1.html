<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>第1チェックポイント</title>

<style>

body{
    font-family:sans-serif;
    max-width:800px;
    margin:auto;
    padding:20px;
    background:#f5f7fb;
    text-align:center;
}

h1{
    color:#0067C0;
    font-size:40px;
}

h2{
    font-size:32px;
}

p{
    font-size:22px;
}

button{
    padding:20px 40px;
    font-size:24px;

    border:none;
    border-radius:12px;

    background:#0067C0;
    color:white;

    cursor:pointer;
}

button:hover{
    background:#0050a0;
}

img{
    max-width:250px;
    height:auto;
}

</style>

</head>
<body>
<h1>第1チェックポイント</h1>
<div id="questionArea">
<h2> 第1チェックポイント</h2>
<p>
スタンプを押して獲得してください！
</p>
<button onclick="getPoint1Stamp()">
 スタンプを押す
</button>
</div>
<div id="result"></div>
<div id="backButton"></div>
<script>
checkCompletedPoint();
function getPoint1Stamp() {
localStorage.setItem(
"point1",
"complete"
);
let count =
Number(
localStorage.getItem("stampCount")
) || 0;
count++;
localStorage.setItem(
"stampCount",
count
);
document.getElementById("result")
.innerHTML = `
<h3> スタンプ獲得！</h3>
 
<img
src="stamp1.kari.jpg"
width="220">
 
<p>
第1スタンプを獲得しました！
</p>
`;
document.getElementById("questionArea")
.style.display = "none";
document.getElementById("backButton")
.innerHTML = `
<button
onclick="location.href='index.html'">
🏠 スタンプ帳へ戻る
</button>
`;
}
function checkCompletedPoint() {
if (
localStorage.getItem("point1")
== "complete"
) {
document.getElementById("questionArea")
.style.display = "none";
document.getElementById("result")
.innerHTML = `
<h3> スタンプ獲得！</h3>
 
<img
src="stamp1.kari.jpg"
width="220">
 
<p>
第1スタンプを獲得しました！
</p>
`;
document.getElementById("backButton")
.innerHTML = `
<button
onclick="location.href='index.html'">
🏠 スタンプ帳へ戻る
</button>
`;
}
}

</script>
</body>
</html>
