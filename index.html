<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>淞風祭スタンプラリー</title>
<style>

body{
font-family: sans-serif;
max-width: 800px;
margin: auto;
padding: 20px;
background:#f5f7fb;

text-align:center;
}
 
h1{
color:#0067C0;
font-size:40px;
text-align:center;
}
 
a{
text-decoration:none;
}
 
button{
padding:12px 24px;
margin-top:10px;
cursor:pointer;
border:none;
border-radius:8px;
background:#0067C0;
color:white;
font-size:16px;
}
button:hover{
background:#0050a0;
}

.card{
background:rgb(57, 219, 117);
padding:40px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,0.15);
margin-bottom:20px;
}
.stamp-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:15px;
}
.stamp-cell{
background:white;
border-radius:10px;
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
box-shadow:
0 2px 5px rgba(0,0,0,0.1);
height:140px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
position:relative;
}
.stamp-number{
position:absolute;
top:8px;
left:10px;
width:24px;
height:24px;
border-radius:50%;
background:#0067C0;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
}
h2{
font-size:28px;
margin-bottom:20px;
}
.empty-stamp{
margin-top:-30px;
font-size:25px;
}
</style>

</head>
 
<body>
 
<h1>🎉 淞風祭スタンプラリー</h1>
 
<h2>スタンプカード</h2>
 
<div id="stampBook" class="card"></div>
<p id="progress"></p>
 
<p>
<a href="point1.html">
第1チェックポイントへ
</a>
</p>
<p>
<a href="point2.html">
第2チェックポイントへ
</a>
</p>
<p>
<a href="point3.html">
第3チェックポイントへ
</a>
</p>
<p>
<a href="point4.html">
第4チェックポイントへ
</a>
</p>
<p>
<a href="point5.html">
第5チェックポイントへ
</a>
</p>
<p>
<a href="point6.html">
第6チェックポイントへ
</a>
</p>
<button onclick="resetStamp()">
リセット
</button>
 
<div id="complete"></div>
 
<script>
 
let count =
Number(localStorage.getItem("stampCount")) || 0;
 
updateDisplay();
 
function updateDisplay() {
 
let complete =
 
localStorage.getItem("point1") == "complete" &&
localStorage.getItem("point2") == "complete" &&
localStorage.getItem("point3") == "complete" &&
localStorage.getItem("point4") == "complete" &&
localStorage.getItem("point5") == "complete" &&
localStorage.getItem("point6") == "complete";

let html = `
<div class="stamp-grid">
<div class="stamp-cell">
 
<div class="stamp-number">
1
</div>
 
${
localStorage.getItem("point1")=="complete"
?
'<img src="stamp1.kari.jpg" width="120">'
:
'<div class="empty-stamp"> </div>'
}
 
</div>
<div class="stamp-cell">
<div class="stamp-number">
2
</div>
 
${
localStorage.getItem("point2")=="complete"
?
'<img src="stamp1.kari.jpg" width="120">'
:
' '
}
</div>
<div class="stamp-cell">
<div class="stamp-number">
3
</div>
 
${
localStorage.getItem("point3")=="complete"
?
'<img src="stamp1.kari.jpg" width="120">'
:
' '
}
</div>
<div class="stamp-cell">
<div class="stamp-number">
4
</div>
 
${
localStorage.getItem("point4")=="complete"
?
'<img src="stamp1.kari.jpg" width="120">'
:
' '
}
</div>
<div class="stamp-cell">
<div class="stamp-number">
5
</div>
 
${
localStorage.getItem("point5")=="complete"
?
'<img src="stamp1.kari.jpg" width="120">'
:
' '
}
</div>
<div class="stamp-cell">
<div class="stamp-number">
6
</div>
 
${
localStorage.getItem("point6")=="complete"
?
'<img src="stamp1.kari.jpg" width="120">'
:
' '
}
</div>
</div>
`;
document.getElementById("stampBook")
.innerHTML = html;
if (complete) {
 
document.getElementById("complete")
.innerHTML = `
<div style="
background:#fff3cd;
padding:20px;
border-radius:10px;
border:3px solid orange;
margin-top:20px;
text-align:center;
">
 
<h2 style="
font-size:40px;
color:red;
">
🎉 COMPLETE 🎉
</h2>
 
<p style="
font-size:36px;
font-weight:bold;
">
淞風祭スタンプラリー制覇！
</p>

<p style="
font-size:28px;
line-height:1.8;
font-weight:bold;
">
6個すべてのスタンプを集めました！<br>
受付で景品を受け取ろう！
</p>
 
</div>
`;
}
}
function resetStamp() {
 
localStorage.removeItem("stampCount");
localStorage.removeItem("point1");
localStorage.removeItem("point2");
localStorage.removeItem("point3");
localStorage.removeItem("point4");
localStorage.removeItem("point5");
localStorage.removeItem("point6");
location.reload();
}
 
</script>
 
</body>
 
</html>
