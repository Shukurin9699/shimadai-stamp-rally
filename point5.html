<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>第5チェックポイント</title>
</head>
<body>
<h1>第5チェックポイント</h1>
<div id="questionArea">
<h2> 第5チェックポイント</h2>
<p>
スタンプを押して獲得してください！
</p>
<button onclick="getPoint5Stamp()">
 スタンプを押す
</button>
</div>
<div id="result"></div>
<div id="backButton"></div>
<script>
checkCompletedPoint();
function getPoint5Stamp() {
localStorage.setItem(
"point5",
"complete"
);
let count =
Number(
localStorage.getItem("stampCount")
) || 0;
count++;
localStorage.setItem(
"stampCount",
count
);
document.getElementById("result")
.innerHTML = `
<h3> スタンプ獲得！</h3>
 
<img
src="stamp1.kari.jpg"
width="220">
 
<p>
第5スタンプを獲得しました！
</p>
`;
document.getElementById("questionArea")
.style.display = "none";
document.getElementById("backButton")
.innerHTML = `
<button
onclick="location.href='index.html'">
🏠 スタンプ帳へ戻る
</button>
`;
}
function checkCompletedPoint() {
if (
localStorage.getItem("point5")
== "complete"
) {
document.getElementById("questionArea")
.style.display = "none";
document.getElementById("result")
.innerHTML = `
<h3> スタンプ獲得！</h3>
 
<img
src="stamp1.kari.jpg"
width="220">
 
<p>
第5スタンプを獲得しました！
</p>
`;
document.getElementById("backButton")
.innerHTML = `
<button
onclick="location.href='index.html'">
🏠 スタンプ帳へ戻る
</button>
`;
}
}

</script>
</body>
</html>
