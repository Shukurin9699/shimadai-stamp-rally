<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>第4チェックポイント</title>
<style>

body{
    font-family:sans-serif;
    max-width:800px;
    margin:auto;
    padding:20px;
    background:#f5f7fb;
    text-align:center;
}

h1{
    color:#0067C0;
    font-size:70px;
}

h3{
    font-size:60px;
    color:#0067C0;
}

p{
    font-size:30px;
    font-weight:bold;
}

button{
    padding:30px 60px;
    font-size:40px;

    border:none;
    border-radius:12px;

    background:#0067C0;
    color:white;

    cursor:pointer;
}

button:hover{
    background:#0050a0;
}

img{
    max-width:250px;
    height:auto;
}

</style>
</head>
<body>
<h1>性教育ユースカフェ</h1>
<div id="questionArea">
<p>
スタンプを押して獲得してください！
</p>
<button onclick="getPoint4Stamp()">
 スタンプを押す
</button>
</div>
<div id="result"></div>
<div id="backButton"></div>
<script>
checkCompletedPoint();
function getPoint4Stamp() {
localStorage.setItem(
"point4",
"complete"
);
let count =
Number(
localStorage.getItem("stampCount")
) || 0;
count++;
localStorage.setItem(
"stampCount",
count
);
document.getElementById("result")
.innerHTML = `
<h3 style="
font-size:48px;
color:#0067C0;
margin-bottom:10px;
">
 スタンプ獲得！
</h3>

<img
src="1791549033056.jpg"
width="350">

`;
document.getElementById("questionArea")
.style.display = "none";
document.getElementById("backButton")
.innerHTML = `
<button
onclick="location.href='index.html'">
🏠 スタンプ帳へ戻る
</button>
`;
}
function checkCompletedPoint() {
if (
localStorage.getItem("point4")
== "complete"
) {
document.getElementById("questionArea")
.style.display = "none";
document.getElementById("result")
.innerHTML = `
<h3 style="
font-size:48px;
color:#0067C0;
margin-bottom:10px;
">
 スタンプ獲得！
</h3>

<img
src="1791549033056.jpg"
width="350">

`;
document.getElementById("backButton")
.innerHTML = `
<button
onclick="location.href='index.html'">
🏠 スタンプ帳へ戻る
</button>
`;
}
}

</script>
</body>
</html>
